name: Aurora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  AURORA_ENV: "development"
  AURORA_LOG_LEVEL: "WARNING"
  MLFLOW_TRACKING_URI: "sqlite:///outputs/mlflow_test.db"

jobs:
  # ── Linting & formatting ───────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linting tools
        run: pip install ruff black isort

      - name: Run ruff
        run: ruff check aurora/ tests/ --output-format=github

      - name: Check black formatting
        run: black --check aurora/ tests/

      - name: Check isort
        run: isort --check-only aurora/ tests/

  # ── Type checking ──────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install mypy types-PyYAML types-toml pandas-stubs

      - name: Run mypy
        run: mypy aurora/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # mypy errors are advisory in early dev

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install \
            numpy pandas scipy statsmodels hmmlearn \
            scikit-learn xgboost lightgbm \
            torch --extra-index-url https://download.pytorch.org/whl/cpu \
            pydantic pydantic-settings loguru diskcache tenacity \
            pytest pytest-asyncio pytest-cov pytest-mock

      - name: Create output dirs
        run: mkdir -p outputs/{data,cache,models,results,figures}

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --timeout=120 \
            --cov=aurora \
            --cov-report=term-missing \
            --cov-report=xml \
            -x \
            -k "not test_ingestion"   # skip network tests in CI

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        if: matrix.python-version == '3.11'

  # ── Docker build check ─────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: aurora-financial-intelligence:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
